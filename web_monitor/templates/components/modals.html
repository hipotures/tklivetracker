<!-- Modals -->
<!-- Edit User Modal -->
<div id="edit-user-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-user-title" aria-hidden="true">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="edit-user-title">Edit User</h3>
            <button class="modal-close" data-screenshot-id="edit-user-modal-close" type="button" aria-label="Close edit user dialog"><svg class="ui-icon" aria-hidden="true"><use href="{{ url_for('static', filename='vendor/lucide/icons.svg') }}#x"></use></svg></button>
        </div>
        <div class="modal-body">
            <form id="edit-user-form">
                <div class="form-group">
                    <label for="edit-username">Username</label>
                    <input type="text" id="edit-username" class="input-field" readonly>
                </div>
                {% if feature_flags.legacySchedulerStatsEnabled %}
                <div class="form-group">
                    <label for="edit-check-interval">Check Interval (seconds)</label>
                    <input type="number"
                           id="edit-check-interval"
                           class="input-field"
                           min="1"
                           max="3600"
                           step="1"
                           required
                           aria-describedby="edit-check-interval-help"
                           data-read-only-disable>
                    <small id="edit-check-interval-help" class="form-help">Enter interval between 1 and 3600 seconds (1s - 1h)</small>
                </div>
                {% endif %}
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox"
                               id="edit-is-active"
                               data-read-only-disable>
                        <span class="checkmark"></span>
                        Active (monitoring enabled)
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox"
                               id="edit-is-favorite"
                               data-read-only-disable>
                        <span class="checkmark"></span>
                        Favorite (starred user)
                    </label>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox"
                               id="edit-notifications-enabled"
                               data-read-only-disable>
                        <span class="checkmark"></span>
                        Notifications (get alerts when user goes live)
                    </label>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-screenshot-id="edit-user-modal-cancel" data-dismiss="modal">Cancel</button>
            <button type="submit"
                    form="edit-user-form"
                    class="btn btn-primary"
                    id="edit-save-btn"
                    data-read-only-disable>
                Save Changes
            </button>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div id="confirm-modal" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message" aria-hidden="true">
    <div class="modal-content modal-small">
        <div class="modal-header">
            <h3 id="confirm-title">Confirm Action</h3>
            <button class="modal-close" data-screenshot-id="confirm-modal-close" type="button" aria-label="Close confirmation dialog"><svg class="ui-icon" aria-hidden="true"><use href="{{ url_for('static', filename='vendor/lucide/icons.svg') }}#x"></use></svg></button>
        </div>
        <div class="modal-body">
            <p id="confirm-message">Are you sure?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-screenshot-id="confirm-modal-cancel" data-dismiss="modal">Cancel</button>
            <button type="button" id="confirm-action" class="btn btn-danger" data-read-only-disable>Confirm</button>
        </div>
    </div>
</div>

<!-- Toast Notifications -->
<div id="toast-container" class="toast-container" aria-live="polite" aria-relevant="additions">
    <!-- Toasts will be dynamically added here -->
</div>

<!-- Loading Overlay -->
<div id="loading-overlay" class="loading-overlay hidden" role="status" aria-live="polite" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
    <span class="visually-hidden">Loading data</span>
</div>

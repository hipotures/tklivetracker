<!-- Favorites Page -->
<div id="favorites-page" class="page">
    <div class="page-header">
        <div>
            <h2>Favorite Users</h2>
            <p class="page-subtitle">Your starred users for quick access</p>
        </div>
    </div>

    <!-- Favorites Summary -->
    <div class="favorites-summary">
        <div class="stat-card">
            <div class="stat-value" id="favorites-total">--</div>
            <div class="stat-label">Total Favorites</div>
        </div>
        <div class="stat-card live">
            <div class="stat-value" id="favorites-live">--</div>
            <div class="stat-label">Favorites Live</div>
        </div>
    </div>

    <div id="favorites-content" class="favorites-grid" aria-live="polite" aria-busy="false">
        <!-- Favorite users will be populated here -->
    </div>
</div>
